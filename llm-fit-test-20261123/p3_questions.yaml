        INSERT INTO Person (id, first_name, last_name, gender, birth_year, creation_year) VALUES (99999901, 'Ada', 'Lovelace', 'female', 1990, 2013)
      - |-
        INSERT INTO Knows (person1_id, person2_id, since_year) VALUES (933, 99999901, 2013)
