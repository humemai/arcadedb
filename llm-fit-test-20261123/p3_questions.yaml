    pg:
      - BEGIN
      - |-
        INSERT INTO "Memory" (id, agent, kind, content, importance, created) VALUES (9100, 'alice', 'note', 'draft', 1, 1700100100)
      - |-
        UPDATE "Memory" SET importance = 1 WHERE id = 70
      - ROLLBACK
