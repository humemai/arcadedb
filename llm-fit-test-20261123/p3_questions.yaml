  # ---------------------------------------------------------------- a join, then an aggregate, then a write (4)
  - id: J01
    construct: join_aggregate
    text: "Find the 3 tags that the most persons are interested in (ties: smaller tag id first) and insert one memory per tag into Memory: id equal to 700000 plus the tag id, agent 'graph', kind 'stat', content the tag name, importance the number of persons interested in the tag, created 1700300000, no subject."
    pg:
      - |-
        INSERT INTO "Memory" (id, agent, kind, content, importance, created) SELECT 700000 + t.id, 'graph', 'stat', t.name, count(*), 1700300000 FROM "HAS_INTEREST" h JOIN "Tag" t ON t.rid = h.target_id GROUP BY t.id, t.name ORDER BY count(*) DESC, t.id LIMIT 3
    sql:
      - |-
        INSERT INTO Memory (id, agent, kind, content, importance, created) SELECT 700000 + t.id, 'graph', 'stat', t.name, count(*), 1700300000 FROM HasInterest h JOIN Tag t ON t.id = h.tag_id GROUP BY t.id, t.name ORDER BY count(*) DESC, t.id LIMIT 3
    rb: mem
  - id: J02
    construct: join_aggregate
    text: "For every country in which at least 300 persons live (a person lives in a city and a city is part of a country), insert one memory into Memory: id equal to 800000 plus the country id, agent 'graph', kind 'stat', content the country name, importance the number of persons living in the country, created 1700300001, no subject."
    pg:
      - |-
        INSERT INTO "Memory" (id, agent, kind, content, importance, created) SELECT 800000 + co.id, 'graph', 'stat', co.name, count(*), 1700300001 FROM "Person" p JOIN "IS_LOCATED_IN" l ON l.source_id = p.rid JOIN "City" c ON c.rid = l.target_id JOIN "IS_PART_OF" e ON e.source_id = c.rid JOIN "Country" co ON co.rid = e.target_id GROUP BY co.id, co.name HAVING count(*) >= 300
    sql:
      - |-
        INSERT INTO Memory (id, agent, kind, content, importance, created) SELECT 800000 + co.id, 'graph', 'stat', co.name, count(*), 1700300001 FROM Person p JOIN City c ON c.id = p.city_id JOIN Country co ON co.id = c.country_id GROUP BY co.id, co.name HAVING count(*) >= 300
    rb: mem
  - id: J03
    construct: join_aggregate
    text: "Delete from Memory every memory whose subject is a person who has no friends at all (a person with no row in KNOWS, as either end of a friendship). Memories without a subject stay."
    pg:
      - |-
        DELETE FROM "Memory" WHERE subject IN (SELECT p.id FROM "Person" p WHERE NOT EXISTS (SELECT 1 FROM "KNOWS" k WHERE k.source_id = p.rid OR k.target_id = p.rid))
    sql:
      - |-
        DELETE FROM Memory WHERE subject IN (SELECT p.id FROM Person p WHERE NOT EXISTS (SELECT 1 FROM Knows k WHERE k.person1_id = p.id OR k.person2_id = p.id))
    rb: mem
  - id: J04
    construct: join_aggregate
    text: "Copy into MemoryArchive (same ids and values) every memory whose subject is a person with at least 60 friends. A friendship counts for both of its persons."
    pg:
      - |-
        INSERT INTO "MemoryArchive" (id, agent, kind, content, importance, created, subject) SELECT id, agent, kind, content, importance, created, subject FROM "Memory" WHERE subject IN (SELECT p.id FROM "Person" p JOIN (SELECT source_id AS r FROM "KNOWS" UNION ALL SELECT target_id FROM "KNOWS") f ON f.r = p.rid GROUP BY p.id HAVING count(*) >= 60)
    sql:
      - |-
        INSERT INTO MemoryArchive (id, agent, kind, content, importance, created, subject) SELECT id, agent, kind, content, importance, created, subject FROM Memory WHERE subject IN (SELECT p.id FROM Person p JOIN (SELECT person1_id AS r FROM Knows UNION ALL SELECT person2_id FROM Knows) f ON f.r = p.id GROUP BY p.id HAVING count(*) >= 60)
    rb: mem
