    text: "In one transaction, add a new person with id 99999901, first name 'Ada', last name 'Lovelace', gender 'female', birth year 1990 and creation year 2013, and make that person a friend of person 933 since 2013 (store the friendship the way the table stores every friendship)."
    pg:
      - BEGIN
      - |-
        INSERT INTO "Person" (id, "firstName", "lastName", gender, "birthYear", "creationYear") VALUES (99999901, 'Ada', 'Lovelace', 'female', 1990, 2013)
      - |-
        INSERT INTO "KNOWS" (source_id, target_id, "sinceYear") SELECT a.rid, b.rid, 2013 FROM "Person" a, "Person" b WHERE a.id = 933 AND b.id = 99999901
      - COMMIT
    sql:
      - BEGIN
