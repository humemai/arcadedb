# Fork only (humemai/arcadedb, PostgreSQL-style SQL prototype): the fast loop. mvn-test.yml builds a Docker image and runs the
# whole suite, which takes the better part of an hour; this runs only the tests of the postgresql packages: the engine tests (a
# build of the engine module and a few seconds of tests) and the tests of the same packages in postgresw, which compare the engine
# with the wire module (a build of the modules postgresw needs). Two jobs, side by side, on every push to a feat/pg-* branch and on
# every pull request into the prototype branch. The full suite still runs on the pull request through mvn-test.yml, whose modules
# shard of unit-tests runs the postgresw tests too. Drop this file when anything goes upstream.
name: PostgreSQL prototype - engine tests

on:
  pull_request:
    branches:
      - feat/postgresql-prototype
  push:
    branches:
      - "feat/pg-**"

permissions:
  contents: read

# One run per branch: a push to a branch with an open pull request starts the run of the pull request too, and the newer one
# cancels the older. head_ref is the branch of a pull request, ref_name the branch of a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests of the postgresql packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      # -am: the module is built from this tree, not resolved from ~/.m2 (CLAUDE.md, "Testing a subset of modules needs -am").
      # The includes pattern selects the test classes of any directory named postgresql, the *IT.java exclusion of the
      # surefire configuration still applies. A new test of the prototype goes in such a directory and runs here.
      - name: Run the engine tests of the postgresql packages
        run: ./mvnw test --batch-mode --errors --show-version -pl engine -am "-Dsurefire.includes=**/postgresql/**/*Test.java"

  # The wire module depends on the engine, so a test that compares the two (the column types of the language against the
  # PostgresType mapping of the wire) lives in postgresw, in a package named postgresql. -am builds the modules it needs from this
  # tree. The test phase is enough: the tests selected here use no TinkerPop class, which is what the shaded gremlin jar of a
  # package-phase build would bring (CLAUDE.md, "Any reactor invocation containing gremlin").
  wire-tests:
    name: Wire module tests of the postgresql packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Run the postgresw tests of the postgresql packages
        run: ./mvnw test --batch-mode --errors --show-version -pl postgresw -am "-Dsurefire.includes=**/postgresql/**/*Test.java"
