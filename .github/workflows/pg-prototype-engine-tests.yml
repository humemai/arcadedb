# Fork only (humemai/arcadedb, PostgreSQL-style SQL prototype): the fast loop. mvn-test.yml builds a Docker image and runs the
# whole suite, which takes the better part of an hour; this runs the tests that cover the prototype: the engine tests of the
# postgresql packages (a build of the engine module and a few seconds of tests); every unit test and integration test of
# postgresw, the wire module (a build of the modules postgresw needs); the census module, whose checks read the classes of every
# module (a build of all of them); and the list of PostgreSQL's functions and operators, which a PostgreSQL 18 server writes.
# Jobs side by side, on every push to a feat/pg-* branch and to the prototype branch, and on every pull request into the
# prototype branch. The client suites that need the server image run after a merge (pg-client-e2e.yml). The full suite is started
# by hand (mvn-test.yml). Drop this file when anything goes upstream.
name: PostgreSQL prototype - engine tests

on:
  pull_request:
    branches:
      - feat/postgresql-prototype
  push:
    branches:
      - "feat/pg-**"
      # the run after a merge: it saves the Maven caches that the runs of pull requests restore (.github/actions/pg-maven-setup)
      - feat/postgresql-prototype

permissions:
  contents: read

# One run per branch and event: a push to a branch with an open pull request starts the run of the pull request too. They are
# separate groups, so that neither cancels the other: a cancelled run is a check that is not SUCCESS on the head of the pull
# request, and the merge guard refuses a head with one. A newer push still cancels the older run of the same event.
# head_ref is the branch of a pull request, ref_name the branch of a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests of the postgresql packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and Maven
        uses: ./.github/actions/pg-maven-setup

      # -am: the module is built from this tree, not resolved from ~/.m2 (CLAUDE.md, "Testing a subset of modules needs -am").
      # The includes pattern selects the test classes of any directory named postgresql, the *IT.java exclusion of the
      # surefire configuration still applies. A new test of the prototype goes in such a directory and runs here.
      - name: Run the engine tests of the postgresql packages
        run: ./mvnw test --batch-mode --errors --show-version -pl engine -am "-Dsurefire.includes=**/postgresql/**/*Test.java"

      # AgentSqlFitTest and AgentSqlPlanTest measure how much of the SQL that language models write the parser accepts and what the
      # engine does with the part it accepts (fork issue #7). They write their reports next to the test results: the tables go into
      # the job summary (the list of every statement does not), the files are an artifact. The tests never fail on the numbers.
      - name: Report of the agent SQL measurement
        if: always()
        run: |
          for report in engine/target/pg-agent-fit/*.md; do
            [ -f "$report" ] || continue
            sed '/^## Every statement/,$d' "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the report of the agent SQL measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-agent-fit-report
          path: engine/target/pg-agent-fit/*.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Where the Maven files came from
        if: always()
        run: bash .github/scripts/pg_maven_report.sh

  # The wire module depends on the engine, so a test that compares the two (the column types of the language against the
  # PostgresType mapping of the wire) lives in postgresw, in a package named postgresql. -am builds the modules it needs from this
  # tree. The test phase is enough: the tests selected here use no TinkerPop class, which is what the shaded gremlin jar of a
  # package-phase build would bring (CLAUDE.md, "Any reactor invocation containing gremlin").
  wire-tests:
    name: Wire module unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and Maven
        uses: ./.github/actions/pg-maven-setup

      # The second pattern is every unit test of the wire module (fork issue #282), whose package is com.arcadedb.postgres. The wire
      # tests of the language (fork issue #12) are among them: they extend PostgresWireProtocolTestBase, which is package private, so
      # they are named PostgreSQL*Test there. They start an in-process server, which discovers the Gremlin plugin on its class path,
      # and that plugin needs the TinkerPop classes of the shaded gremlin jar: so this step is a package-phase build (the earlier
      # note about the test phase held for tests that start no server). They connect with the JDBC driver of PostgreSQL, and psql
      # and psycopg run in containers.
      - name: Run the unit tests of the wire module and of the postgresql packages
        run: ./mvnw package --batch-mode --errors --show-version -pl postgresw -am "-Dsurefire.includes=**/postgresql/**/*Test.java,**/postgres/**/*Test.java"

      # What the psql corpus (fork issue #12, W3) got from real PostgreSQL 18 and from this server, one file per case. A new case has its
      # expected output here: review it and commit it to postgresw/src/test/resources/pgwire/expected.
      - name: Upload what PostgreSQL 18 and this server printed for the psql corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-wire-corpus
          path: postgresw/target/pgwire/
          if-no-files-found: ignore
          retention-days: 30

      - name: Where the Maven files came from
        if: always()
        run: bash .github/scripts/pg_maven_report.sh

  # The integration tests of the wire module (fork issue #282). Surefire excludes *IT classes, so the job above runs none of them.
  # In a row they take about ten minutes, nearly half of that in two classes, so two jobs share them: one runs those two, the
  # other every other class of the module, a new one among them. -DskipTests leaves the unit tests out, and
  # failIfNoSpecifiedTests lets the modules that -am builds, which have no class of the pattern, pass.
  wire-integration-tests:
    name: Wire module integration tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: follower forwarding and JDBC
            tests: "**/postgres/PostgresFollowerForwardingIT.java,**/postgres/PostgresWJdbcIT.java"
          - shard: all others
            tests: "**/postgres/**/*IT.java,!**/postgres/PostgresFollowerForwardingIT.java,!**/postgres/PostgresWJdbcIT.java"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and Maven
        uses: ./.github/actions/pg-maven-setup

      - name: Run the integration tests of the wire module
        run: >-
          ./mvnw verify -Pintegration -DskipTests --batch-mode --errors --show-version -pl postgresw -am
          "-Dit.test=${{ matrix.tests }}" -Dfailsafe.failIfNoSpecifiedTests=false

      - name: Upload the test reports of a red run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-wire-it-reports-${{ strategy.job-index }}
          path: postgresw/target/failsafe-reports/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Where the Maven files came from
        if: always()
        run: bash .github/scripts/pg_maven_report.sh

  # The censuses range over the compiled classes of every module, the postgresql packages among them, and the jobs above run
  # none of them: a pull request with refusals or a schema walk that a census rejects was green (fork issue #160). A census fails
  # when a module is missing from its class path, so -am builds them all from this tree; the includes pattern selects the tests of
  # the census module.
  census-tests:
    name: Censuses over every module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and Maven
        uses: ./.github/actions/pg-maven-setup

      - name: Run the census module
        run: ./mvnw package --batch-mode --errors --show-version -pl census -am "-Dsurefire.includes=**/census/**/*Test.java"

      - name: Where the Maven files came from
        if: always()
        run: bash .github/scripts/pg_maven_report.sh

  # The postgresql language answers 0A000 for a function or operator that PostgreSQL 18 has and it lacks (fork issue #198), from
  # a committed list that a script writes from the catalog of a server. This job writes it again: the committed file must be
  # what the server gives.
  catalog-list:
    name: PostgreSQL 18 list of functions and operators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the list from a PostgreSQL 18 server
        run: .github/scripts/pg_catalog_list.sh

      - name: Upload the list the server gave
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-catalog-list
          path: engine/src/main/resources/com/arcadedb/query/postgresql/eval/postgresql-18-catalog.tsv
          if-no-files-found: error
          retention-days: 30

      - name: The committed list is the one of the server
        run: |
          list=engine/src/main/resources/com/arcadedb/query/postgresql/eval/postgresql-18-catalog.tsv
          if ! git ls-files --error-unmatch "$list" > /dev/null || ! git diff --exit-code --stat -- "$list"; then
            echo "$list is not the committed output of .github/scripts/pg_catalog_list.sh" >&2
            exit 1
          fi
