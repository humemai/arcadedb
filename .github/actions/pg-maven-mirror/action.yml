# Fork only (humemai/arcadedb, PostgreSQL-style SQL prototype). Call it after actions/setup-java, which writes a
# ~/.m2/settings.xml of its own, and before the first Maven command of the job. Drop it when anything goes upstream.
#
# Maven Central answers the shared GitHub runners with HTTP 429, so the requests for central go to the mirror that Google hosts,
# and the resolver retries a 429 or a 503 more often than its default of 3 times.
name: PostgreSQL prototype - Maven Central mirror
description: Maven Central through a mirror with retries

inputs:
  repository-id:
    description: >-
      The id Maven records for a file it downloads through the mirror. A job that restores a cache filled straight from Maven
      Central passes central, because Maven downloads a cached file again when it was recorded under another id.
    default: google-central

runs:
  using: composite
  steps:
    # MAVEN_ARGS is read by Maven 3.9 and later, and what an earlier step put there (setup-java adds -ntp) stays. MVNW_REPOURL
    # makes the wrapper download the Maven distribution from the mirror too.
    - name: Send Maven Central through the mirror
      shell: bash
      env:
        REPOSITORY_ID: ${{ inputs.repository-id }}
      run: |
        mkdir -p "$HOME/.m2"
        cat > "$HOME/.m2/settings.xml" <<EOF
        <settings>
          <mirrors>
            <mirror>
              <id>${REPOSITORY_ID}</id>
              <mirrorOf>central</mirrorOf>
              <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
            </mirror>
          </mirrors>
        </settings>
        EOF
        echo "MVNW_REPOURL=https://maven-central.storage-download.googleapis.com/maven2" >> "$GITHUB_ENV"
        echo "MAVEN_ARGS=${MAVEN_ARGS:+$MAVEN_ARGS }-Daether.transport.http.retryHandler.count=6 -Daether.transport.http.retryHandler.serviceUnavailable=429,502,503,504" >> "$GITHUB_ENV"
