# Fork only (humemai/arcadedb, PostgreSQL-style SQL prototype): the JDK and Maven setup of the prototype's own workflows
# (pg-prototype-engine-tests.yml, pg-parity-tests.yml). Call it after actions/checkout. Drop it when anything goes upstream.
#
# Maven Central goes through the mirror of .github/actions/pg-maven-mirror. Each job has its own cache: the cache of
# setup-java has one key for every job and workflow of the repository, so the job that saved first decided what all the others
# got, and an exact hit is never saved again.
name: PostgreSQL prototype - JDK and Maven
description: JDK 21, Maven Central through a mirror with retries, and the Maven cache of the calling job

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: "temurin"
        java-version: 21

    - name: Send Maven Central through the mirror
      uses: ./.github/actions/pg-maven-mirror

    # A cache saved by a run of the prototype branch is the one that every pull request into that branch can read. So only a run
    # of that branch saves (after the job succeeded), and every other run restores, which also keeps the branches from filling
    # the cache quota of the repository.
    - name: Restore the Maven cache of this job, and save it after the job
      if: github.ref == 'refs/heads/feat/postgresql-prototype'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: pg-maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties', '.github/workflows/pg-*.yml', '.github/actions/pg-maven-setup/action.yml') }}
        restore-keys: pg-maven-${{ runner.os }}-${{ github.job }}-

    - name: Restore the Maven cache of this job
      if: github.ref != 'refs/heads/feat/postgresql-prototype'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: pg-maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties', '.github/workflows/pg-*.yml', '.github/actions/pg-maven-setup/action.yml') }}
        restore-keys: pg-maven-${{ runner.os }}-${{ github.job }}-
